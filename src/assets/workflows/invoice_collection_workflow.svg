<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" role="img" aria-label="Invoice escalation pipeline diagram">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>Invoice escalation pipeline diagram</title>
<g>
  <rect x="20" y="55" width="200" height="60" rx="10" fill="rgba(26,17,40,0.55)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <rect x="20" y="55" width="4" height="60" rx="2" fill="#9CA3AF"/>
  <text x="34" y="79" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Poll invoices</text>
  <text x="34" y="99" fill="#D8D4E8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400">Monitor payment status</text>
</g>
<g>
  <rect x="240" y="55" width="200" height="60" rx="10" fill="rgba(26,17,40,0.55)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <rect x="240" y="55" width="4" height="60" rx="2" fill="#9CA3AF"/>
  <text x="254" y="79" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Escalation tiering</text>
  <text x="254" y="99" fill="#D8D4E8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400">7/14/21/28-day buckets</text>
</g>
<g>
  <rect x="460" y="55" width="200" height="60" rx="10" fill="rgba(26,17,40,0.55)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <rect x="460" y="55" width="4" height="60" rx="2" fill="#C4B5FD"/>
  <text x="474" y="79" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">AI drafts email</text>
  <text x="474" y="99" fill="#D8D4E8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400">Tier-matched follow-up</text>
</g>
<g>
  <rect x="130" y="165" width="200" height="60" rx="10" fill="rgba(26,17,40,0.55)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <rect x="130" y="165" width="4" height="60" rx="2" fill="#5EEAD4"/>
  <text x="144" y="189" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Send via Gmail</text>
  <text x="144" y="209" fill="#D8D4E8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400">Delivers to client</text>
</g>
<g>
  <rect x="350" y="165" width="200" height="60" rx="10" fill="rgba(26,17,40,0.55)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <rect x="350" y="165" width="4" height="60" rx="2" fill="#5EEAD4"/>
  <text x="364" y="189" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Update database</text>
  <text x="364" y="209" fill="#D8D4E8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400">Prevents duplicate sends</text>
</g>
<line x1="220" y1="85" x2="240" y2="85" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="440" y1="85" x2="460" y2="85" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M560 115 L560 140 L230 140 L230 165" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="330" y1="195" x2="350" y2="195" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>