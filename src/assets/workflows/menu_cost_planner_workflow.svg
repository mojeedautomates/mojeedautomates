<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 236" role="img" width="100%">
  <title>Restaurant menu and cost planner workflow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="30" y="30" width="300" height="72" rx="10" fill="rgba(26,17,40,0.55)" stroke="rgba(255,255,255,0.2)"/>
    <rect x="30" y="30" width="4" height="72" rx="2" fill="#9CA3AF"/>
    <text x="48" y="58" fill="#FFFFFF" font-size="14" font-weight="600">Live ingredient prices</text>
    <text x="48" y="80" fill="#D8D4E8" font-size="12">Tracks current market costs</text>
  </g>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
