    <rect x="370" y="30" width="4" height="72" rx="2" fill="#C4B5FD"/>
    <text x="388" y="58" fill="#FFFFFF" font-size="14" font-weight="600">Linked recipe costing</text>
    <text x="388" y="80" fill="#D8D4E8" font-size="12">Recalculates every dish automatically</text>
  </g>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="370" y="134" width="300" height="72" rx="10" fill="rgba(26,17,40,0.55)" stroke="rgba(255,255,255,0.2)"/>
    <rect x="370" y="134" width="4" height="72" rx="2" fill="#5EEAD4"/>
    <text x="388" y="162" fill="#FFFFFF" font-size="14" font-weight="600">Daily meal planner</text>
    <text x="388" y="184" fill="#D8D4E8" font-size="12">Schedules the kitchen menu</text>
  </g>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
