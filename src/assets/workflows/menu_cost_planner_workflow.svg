  </g>
  <line x1="330" y1="66" x2="370" y2="66" stroke="rgba(255,255,255,0.55)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M520 102V134" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="170" x2="330" y2="170" stroke="rgba(255,255,255,0.55)" stroke-width="1.5" marker-end="url(#arrow)"/>
