<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" role="img" aria-label="Client onboarding diagram">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>Client onboarding diagram</title>
<g>
  <rect x="120" y="55" width="200" height="60" rx="10" fill="rgba(26,17,40,0.55)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <rect x="120" y="55" width="4" height="60" rx="2" fill="#9CA3AF"/>
  <text x="134" y="79" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Client intake</text>
  <text x="134" y="99" fill="#D8D4E8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400">Checks Airtable for duplicates</text>
</g>
<g>
  <rect x="360" y="55" width="200" height="60" rx="10" fill="rgba(26,17,40,0.55)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <rect x="360" y="55" width="4" height="60" rx="2" fill="#9CA3AF"/>
  <text x="374" y="79" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Project &amp; manager setup</text>
  <text x="374" y="99" fill="#D8D4E8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400">Assigns manager automatically</text>
</g>
<g>
  <rect x="120" y="165" width="200" height="60" rx="10" fill="rgba(26,17,40,0.55)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <rect x="120" y="165" width="4" height="60" rx="2" fill="#5EEAD4"/>
  <text x="134" y="189" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Workspace provisioning</text>
  <text x="134" y="209" fill="#D8D4E8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400">Creates Asana &amp; Drive folders</text>
</g>
<g>
  <rect x="360" y="165" width="200" height="60" rx="10" fill="rgba(26,17,40,0.55)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <rect x="360" y="165" width="4" height="60" rx="2" fill="#5EEAD4"/>
  <text x="374" y="189" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Notify &amp; welcome</text>
  <text x="374" y="209" fill="#D8D4E8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400">Emails client, alerts team</text>
</g>
<line x1="320" y1="85" x2="360" y2="85" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M460 115 L460 140 L220 140 L220 165" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="320" y1="195" x2="360" y2="195" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>